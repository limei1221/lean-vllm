[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "inferweave"
version = "0.2.0"
authors = [{ name = "Xingkai Yu" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation for prototyping inference techniques and benchmarking them against vLLM"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.51.0",
    "xxhash",
]

[project.optional-dependencies]
cuda = [
    "triton>=3.0.0",
    "flash-attn",
]

# a group, not an extra: uv installs it on a bare `uv sync`
[dependency-groups]
dev = ["pytest"]

[project.urls]
Homepage="https://github.com/limei1221/inferweave"
Upstream="https://github.com/GeeeekExplorer/nano-vllm"

[tool.uv]
no-build-isolation-package = ["flash-attn"]    # its setup.py imports torch

[tool.setuptools.packages.find]
where = ["."]
include = ["inferweave*"]
