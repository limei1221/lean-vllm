[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-vllm"
version = "0.2.0"
authors = [{ name = "Mei Li" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation for prototyping inference techniques and benchmarking them against vLLM"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.51.0",
    "xxhash",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
cuda = [
    "triton>=3.0.0",
    # The torch vLLM 0.28.0 pins, so a benchmark compares engines rather than
    # PyTorch releases. uv resolves all extras into one lock, so this pin holds
    # in every environment, not just this extra.
    "torch==2.13.0",
    # Built from git below, since FA3 ships no wheel. Scoped to Linux, the only
    # platform its source tree targets; the rest of this extra is NVIDIA-only too.
    "flash-attn-3; sys_platform == 'linux'",
]

[project.scripts]
lean-vllm = "lean_vllm.entrypoints.cli:main"

# a group, not an extra: uv installs it on a bare `uv sync`
[dependency-groups]
dev = [
    "pytest",
    "httpx",       # what the openai SDK speaks: the benchmark client and the ASGI tests
    "httpx2",      # starlette's testclient prefers it and warns when it falls back to httpx
    # the server itself, so `uv run pytest tests/` runs the whole suite rather than
    # skipping the two modules that importorskip fastapi
    "lean-vllm[serve]",
    # example_serving.py. Pinned below 3: openai 3.x streams over httpx2, which
    # prints a cosmetic teardown traceback that makes a working example look broken.
    "openai>=2.0.0,<3",
]

[project.urls]
Homepage="https://github.com/limei1221/lean-vllm"
Upstream="https://github.com/GeeeekExplorer/nano-vllm"

[tool.pytest.ini_options]
filterwarnings = [
    # starlette 1.6.0 imports a deprecated anyio alias; drop this when it stops.
    'ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning',
]

[tool.uv]
required-version = ">=0.12"    # the floor extra-build-variables below was verified against

[tool.uv.sources]
# Pinned to a commit: FA3 is released from main, so an unpinned branch would
# rebuild a different kernel set on every lock.
flash-attn-3 = { git = "https://github.com/Dao-AILab/flash-attention", subdirectory = "hopper", rev = "98eb7998a0eba4047c7a30375522569d4b8efb20" }

# Static metadata, so resolution never runs hopper/setup.py. That script asks
# nvcc what to build before it will report its own dependencies, which fails on
# any machine without CUDA and would leave `uv lock` runnable on the GPU box
# alone. Matches __version__ and install_requires at the commit above.
[[tool.uv.dependency-metadata]]
name = "flash-attn-3"
version = "3.0.0"
requires-dist = ["torch", "einops", "packaging", "ninja"]

# The build wants the torch it will run against, and setup.py imports the rest.
[tool.uv.extra-build-dependencies]
flash-attn-3 = [
    { requirement = "torch", match-runtime = true },
    "psutil",
    "setuptools",
    "wheel",
    "packaging",
    "einops",
    "ninja",
]

# Kernels an inference engine never reaches. Compiling them is most of a long
# build. MAX_JOBS from the calling shell still applies, and is worth setting on
# a host that cannot feed one nvcc per core.
[tool.uv.extra-build-variables]
flash-attn-3 = { FLASH_ATTENTION_DISABLE_BACKWARD = "TRUE", FLASH_ATTENTION_DISABLE_FP8 = "TRUE" }

[tool.setuptools.packages.find]
where = ["."]
include = ["lean_vllm*"]
