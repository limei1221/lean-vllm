[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lean-vllm"
version = "0.2.0"
authors = [{ name = "Mei Li" }]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
description = "a lightweight vLLM implementation for prototyping inference techniques and benchmarking them against vLLM"
requires-python = ">=3.10,<3.13"
dependencies = [
    "torch>=2.4.0",
    "transformers>=4.51.0",
    "xxhash",
]

[project.optional-dependencies]
serve = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
cuda = [
    "triton>=3.0.0; sys_platform == 'linux'",
    # Keep the Torch minor used by the graph implementation and the pinned FA source.
    "torch>=2.9,<2.10",
    "vllm-flash-attn==2.7.2.post1; sys_platform == 'linux'",
    # Build tools are installed before the non-isolated FlashAttention build.
    "cmake>=3.26; sys_platform == 'linux'",
    "ninja; sys_platform == 'linux'",
    "packaging; sys_platform == 'linux'",
    "setuptools; sys_platform == 'linux'",
    "wheel; sys_platform == 'linux'",
    "jinja2; sys_platform == 'linux'",
    "psutil; sys_platform == 'linux'",
]

[project.scripts]
lean-vllm = "lean_vllm.entrypoints.cli:main"

# a group, not an extra: uv installs it on a bare `uv sync`
[dependency-groups]
dev = [
    "pytest",
    "httpx",       # what the openai SDK speaks: the benchmark client and the ASGI tests
    "httpx2",      # starlette's testclient prefers it and warns when it falls back to httpx
    # the server itself, so `uv run pytest tests/` runs the whole suite rather than
    # skipping the two modules that importorskip fastapi
    "lean-vllm[serve]",
    # example_serving.py. Pinned below 3: openai 3.x streams over httpx2, which
    # prints a cosmetic teardown traceback that makes a working example look broken.
    "openai>=2.0.0,<3",
]

[project.urls]
Homepage="https://github.com/limei1221/lean-vllm"
Upstream="https://github.com/GeeeekExplorer/nano-vllm"

[tool.pytest.ini_options]
filterwarnings = [
    # starlette 1.6.0 imports a deprecated anyio alias; drop this when it stops.
    'ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning',
]

[tool.uv]
required-version = ">=0.10"
# The fork's standalone build metadata still pins Torch 2.4. Build against the
# installed runtime instead; vLLM 0.11.2 uses this revision with Torch 2.9.0.
no-build-isolation-package = ["vllm-flash-attn"]

[tool.uv.sources]
vllm-flash-attn = { git = "https://github.com/vllm-project/flash-attention.git", rev = "58e0626a692f09241182582659e3bf8f16472659" }

# Static metadata lets uv lock on machines without CUDA. The source pin above
# ensures this override never selects the old Torch-2.4 PyPI binary wheels.
[[tool.uv.dependency-metadata]]
name = "vllm-flash-attn"
version = "2.7.2.post1"
requires-dist = ["torch>=2.9,<2.10"]
requires-python = ">=3.9"

[tool.setuptools.packages.find]
where = ["."]
include = ["lean_vllm*"]
